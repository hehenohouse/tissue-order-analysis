[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blender-fuse"
dynamic = ["version"]
description = "Tissue order-parameter, Fourier, and PIV analysis from H5 segmentations"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Blender Fuse contributors" }]
keywords = ["tissue", "order-parameter", "fourier", "piv", "segmentation", "hdf5"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "h5py>=3.8",
    "matplotlib>=3.6",
    "numpy>=1.23",
    "scikit-image>=0.20",
    "scipy>=1.9",
]

[project.optional-dependencies]
video = [
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4.9",
]
dev = [
    "build>=1.0",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.8",
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4.9",
]

[project.scripts]
blender-fuse = "blender_fuse.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "blender_fuse._version.__version__" }

[tool.setuptools.package-data]
blender_fuse = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["blender_fuse"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
